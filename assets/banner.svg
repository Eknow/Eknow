<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ehiran Rodriguez — Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071820"/>
      <stop offset="50%" stop-color="#0B2F3F"/>
      <stop offset="100%" stop-color="#123A2A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5EEAD4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="980" cy="70" r="120" fill="#2DD4BF" opacity=".18"/>
  <circle cx="180" cy="300" r="140" fill="#F59E0B" opacity=".12"/>
  <rect x="0" y="250" width="1200" height="2" fill="url(#glow)"/>

  <g opacity=".14" stroke="#94A3B8" stroke-width="1">
    <path d="M80 80 H520"/>
    <path d="M80 110 H420"/>
    <path d="M80 140 H470"/>
  </g>

  <g transform="translate(80,78)">
    <rect width="56" height="56" rx="14" fill="#0F766E"/>
    <text x="28" y="37" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ECFDF5">E</text>
  </g>

  <text x="154" y="112" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC">Ehiran Rodriguez</text>
  <text x="154" y="152" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#99F6E4">Frontend Engineer · React · Product Architecture</text>
  <rect x="154" y="176" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="154" y="220" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#CBD5E1">
    Workflows · new architectures · dependency migrations
  </text>
  <text x="154" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">
