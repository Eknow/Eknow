    <text x="24" y="78" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Requirements lead</text>
    <text x="24" y="112" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">Architecture · migrations · features</text>
    <text x="24" y="146" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">Cura + Escudo Vecinal</text>
    <rect x="24" y="164" width="110" height="10" rx="5" fill="#134E4A"/>
    <rect x="24" y="164" width="86" height="10" rx="5" fill="#2DD4BF"/>
