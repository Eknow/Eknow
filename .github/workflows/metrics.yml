# Infographics via https://github.com/lowlighter/metrics
# Requires repository secret: METRICS_TOKEN
name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1 — Overview (joined, followers, commits, repos)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          config_timezone: America/Mexico_City
          config_theme: dark

      # 2 — Isometric commit calendar + streaks
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Mexico_City
          config_theme: dark

      # 3 — Languages: most used + recently used
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_count: 6
          plugin_languages_colors: github
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake,
            shell, gnuplot
          config_timezone: America/Mexico_City
          config_theme: dark

      # 4 — Recent activity (PRs, issues, reviews, releases)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          config_timezone: America/Mexico_City
          config_theme: dark

      # 5 — Notable contributions / collaborations
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes
          config_timezone: America/Mexico_City
          config_theme: dark

      # 6 — Starred topics (skill / interest icons)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
          config_timezone: America/Mexico_City
          config_theme: dark

      # 7 — Coding habits
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: America/Mexico_City
          config_theme: dark

      # 8 — Pinned repositories
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          config_timezone: America/Mexico_City
          config_theme: dark

      # 9 — Achievements (compact)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_timezone: America/Mexico_City
          config_theme: dark
