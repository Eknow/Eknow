# Infographics via https://github.com/lowlighter/metrics
# Requires repository secret: METRICS_TOKEN (GitHub PAT, scopes as needed)
name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Classic overview card (header + activity + community + repos)
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Mexico_City
          config_theme: dark

      # Isometric commit calendar — signature lowlighter look
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Mexico_City
          config_theme: dark

      # Languages activity
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_count: 8
          plugin_languages_colors: github
          config_timezone: America/Mexico_City
          config_theme: dark
