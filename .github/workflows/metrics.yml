# Mono terminal metrics (B/W + monospace where possible)
# Pinned to v3.34 SHA
name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Terminal-style overview
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: terminal
          base: header, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Mexico_City
          config_order: base.header, isocalendar, base.metadata
          extras_css: |
            svg { filter: grayscale(1) contrast(1.1); }
            text, tspan { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace !important; }

      # Calendar card (classic + mono filter)
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Mexico_City
          config_theme: dark
          extras_css: |
            svg { filter: grayscale(1) contrast(1.1); }
            text, tspan { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace !important; }
