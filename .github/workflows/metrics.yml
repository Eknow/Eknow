# B/W terminal profile — only cards that work without heavy private data
# For fuller stats: METRICS_TOKEN with `repo` scope + private contributions on profile
# Pinned to v3.34 SHA
name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Overview only (stable)
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Mexico_City
          config_theme: dark
          extras_css: |
            svg { filter: grayscale(1) contrast(1.08); }

      # Isometric calendar
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Eknow
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Mexico_City
          config_theme: dark
          extras_css: |
            svg { filter: grayscale(1) contrast(1.08); }
